project_id = "lehmglueck"

# subscribe: wird vom öffentlichen Newsletter-Formular ohne Login aufgerufen.
[functions.subscribe]
verify_jwt = false

# confirm-subscriber / unsubscribe: werden per Klick auf einen Mail-Link aufgerufen (GET, kein JWT).
[functions.confirm-subscriber]
verify_jwt = false

[functions.unsubscribe]
verify_jwt = false

# send-newsletter / admin-users prüfen die Admin-Rolle selbst anhand des mitgeschickten Bearer-Tokens.
[functions.send-newsletter]
verify_jwt = true

[functions.admin-users]
verify_jwt = true
