name: Supabase Keep-Alive

# Supabase pausiert Free-Projekte nach 7 Tagen ohne Datenbankaktivität (siehe CLAUDE.md §11).
# Täglicher minimaler Insert + Cleanup in der "ping"-Tabelle hält das Projekt aktiv.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert ping row
        run: |
          curl -sf -X POST "${SUPABASE_URL}/rest/v1/ping" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Delete ping rows older than 2 days
        run: |
          CUTOFF=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X DELETE "${SUPABASE_URL}/rest/v1/ping?created_at=lt.${CUTOFF}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
